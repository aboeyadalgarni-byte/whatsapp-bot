name: Sawha Health
on:
  push:
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/router.js
      - run: node --check src/whatsapp.js
      - run: node --check src/url.js
      - run: node --check src/media.js
